<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in...</title>
<script src="https://cdn.tailwindcss.com"></script>
<script async crossorigin="anonymous" data-clerk-publishable-key="{{ clerk_publishable_key }}"
  src="https://{{ clerk_frontend_api }}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .spinner{width:40px;height:40px;border:3px solid #dbeafe;border-top-color:#1d4ed8;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="text-center">
  <div class="spinner mx-auto mb-4"></div>
  <p class="text-slate-500 text-sm font-medium">Completing sign in...</p>
</div>
<script>
function waitForClerk(cb) {
  if (window.Clerk) { cb(); return; }
  let tries = 0;
  const iv = setInterval(() => { tries++; if (window.Clerk) { clearInterval(iv); cb(); } else if (tries > 50) clearInterval(iv); }, 100);
}
waitForClerk(async () => {
  await window.Clerk.load();
  try {
    const result = await window.Clerk.handleRedirectCallback();
    if (result && result.status === 'complete') {
      window.location.href = '/';
    } else {
      window.location.href = '/login';
    }
  } catch(e) {
    window.location.href = '/login';
  }
});
</script>
</body>
</html>
